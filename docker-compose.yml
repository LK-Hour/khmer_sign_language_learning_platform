services:
  db:
    image: postgres:16
    container_name: ksl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ksl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ksl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ksl"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ksl_pg_data:
